<!DOCTYPE html>
<html>
<head>
    <title>LMS - Member Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
<div class="card p-3 mb-4">
    <h4>Add New Member</h4>
    <div class="row g-3">
        <div class="col-md-4">
            <input type="text" id="nameInput" class="form-control" placeholder="Full Name">
        </div>
        <div class="col-md-3">
            <input type="number" id="cmsInput" class="form-control" placeholder="CMS ID">
        </div>
        <div class="col-md-3">
            <select id="deptInput" class="form-control">
                <option value="" disabled selected hidden>Select Department</option>
                <option value="SEECS">SEECS</option>
                <option value="NBS">NBS</option>
                <option value="S3H">S3H</option>
                <option value="SMME">SMME</option>
                <option value="SNS">SNS</option>
                <option value="ASAB">ASAB</option>
                <option value="SADA">SADA</option>
                <option value="SINES">SINES</option>
                <option value="SCEE">SCEE</option>
                <option value="NICE">NICE</option>
                <option value="EME">EME</option>
                <option value="MCS">MCS</option>

            </select>
        </div>
        <div class="col-md-2">
            <button class="btn btn-success w-100" onclick="addMember()">Add</button>
        </div>
    </div>
</div>
<h2>Library Members</h2>

<div class="container d-flex justify-content-center">
    <div class ="col-md-7">
        <table class="table table-bordered text-center">
            <thead class="table-dark">
            <tr>
                <th class ="col-1">ID</th>
                <th class ="col-3">Name</th>
                <th class ="col-1">CMS</th>
                <th class ="col-1">Department</th>
                <th class ="col-1">Action</th>
            </tr>
            </thead>
            <tbody id="memberTableBody">
            </tbody>
        </table>
    </div>
</div>

<div class="modal fade" id="statusModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalTitle">System Notification</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="modalMessage">
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-primary" data-bs-dismiss="modal">OK</button>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="confirmModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-warning text-dark">
                <h5 class="modal-title">Confirm Action</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <p id="confirmMessageText">Are you sure you want to proceed?</p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" id="confirmBtn" class="btn btn-danger">Delete</button>
            </div>
        </div>
    </div>
</div>


<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="global.js"></script>
<script src="member.js"></script>

</body>
</html>
