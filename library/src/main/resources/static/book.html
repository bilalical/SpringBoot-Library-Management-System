<!DOCTYPE html>
<html>
<head>
    <title>LMS - Book Management</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="container mt-5">
<div class="card p-3 mb-4">
    <h4>Add New Book</h4>
    <div class="row g-3">
        <div class="col-md-4">
            <input type="text" id="titleInput" class="form-control" placeholder="Title">
        </div>
        <div class="col-md-4">
            <input type="text" id="authorInput" class="form-control" placeholder="Author">
        </div>
        <div class="col-md-3">
            <select id="genreInput" class="form-control">
                <option value="" disabled selected hidden>Select Genre</option>
                <option value="FICTION">FICTION</option>
                <option value="NON_FICTION">NON-FICTION</option>
                <option value="SCI_FI">SCI-FI</option>
                <option value="FANTASY">FANTASY</option>
                <option value="MYSTERY">MYSTERY</option>
                <option value="HORROR">HORROR</option>
                <option value="ACADEMIC">ACADEMIC</option>
                <option value="BIOGRAPHY">BIOGRAPHY</option>
                <option value="OTHER">OTHER</option>
            </select>
        </div>
        <div class="col-md-4">
            <input type="text" id="isbnInput" class="form-control" placeholder="ISBN">
        </div>
        <div class = "col-md-2">
            <input type = "number" id = "copiesInput" class = "form-control" placeholder = "Copies">
        </div>
        <div class="col-md-2">
            <button class="btn btn-success w-100" onclick="addBook()">Add</button>
        </div>
    </div>
</div>
<h2>Library Books</h2>
<div class="container d-flex justify-content-center">
    <div class ="col-md-9">
        <table class="table table-bordered text-center">
            <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Author</th>
                <th>Genre</th>
                <th>ISBN</th>
                <th>Copies</th>
                <th>Action</th>
            </tr>
            </thead>
            <tbody id="bookTableBody">
            </tbody>
        </table>
    </div>
</div>


<div class="modal fade" id="statusModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="modalTitle">System Notification</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body" id="modalMessage">
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-primary" data-bs-dismiss="modal">OK</button>
            </div>
        </div>
    </div>
</div>

<div class="modal fade" id="confirmModal" tabindex="-1">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header bg-warning text-dark">
                <h5 class="modal-title">Confirm Action</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
            </div>
            <div class="modal-body">
                <p id="confirmMessageText">Are you sure you want to proceed?</p>
            </div>
            <div class="modal-footer">
                <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
                <button type="button" id="confirmBtn" class="btn btn-danger">Delete</button>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="global.js"></script>
<script src="book.js"></script>
</body>
</html>
